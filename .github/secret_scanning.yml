# Why this file exists
#
# Every published dataset in this repository contains identifiers of the form
# `key-<32 hex>`. GitHub's secret scanner reads them as Mailgun API keys,
# because a Mailgun key is literally `key-` followed by 32 hex characters.
# They are not credentials. They are The National Archives' commentary
# identifiers — the footnote ids legislation.gov.uk attaches to a provision to
# record how it has been amended. For example, in
#
#     https://www.legislation.gov.uk/uksi/2002/2788/data.xml
#
# — a public file that anyone can download without authentication, and which
# contains 99 of them — the id GitHub flags labels this commentary:
#
#     <Commentary id="key-03a4…(28 more hex)…1185" Type="C">
#       Reg. 25 modified (1.9.2013) by …
#
# Statbook carries them so a published figure can point at the amendment
# history behind its provision. That is the product: provenance you can follow.
# They are already published by the UK government; nothing here is secret.
#
# (the id is elided above on purpose: quoting it in full would make THIS
# file trip the same scanner, which is a neat demonstration of the problem)
#
# The 3.0.0 release needed five one-off "false positive" authorisations for
# exactly this. Repeating that at every release is the real hazard — it trains
# whoever cuts the release to click past a security warning, which is how a
# genuine one eventually gets waved through.
#
# Why excluding these paths is safe, rather than merely convenient:
# the dataset files are generated by the pipeline from public sources and are
# reproduced byte-for-byte by the NF-1 gate before any release is built. A
# secret could not be introduced into one without the reproduction failing
# first. Every other file in this repository — README, corrections log, keys,
# manifests, signatures — is still scanned normally.
#
# Note: this suppresses secret scanning ALERTS. GitHub's push protection is
# configured separately and may still block a push containing these files; if
# it does, the one-off "used in tests / false positive" authorisation is still
# the way through, and this file at least stops the alert backlog growing.
#
# Reviewed and committed by the repository owner. Docs:
# https://docs.github.com/code-security/secret-scanning/excluding-folders-and-files-from-secret-scanning

paths-ignore:
  - "releases/**/dataset.json"
  - "releases/**/dataset.sqlite"
